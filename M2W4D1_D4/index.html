Nella pagina HTML, inserisci 2 input di tipo testo (uno per la location e uno per il titolo lavorativo, ricordati di diversificarli con un id) e un bottone con valore “cerca”

Al click del bottone, il codice deve raccogliere i valori dei due input e darli in pasto alla funzione che hai creato nella parte 1. 

Dopo aver raccolto ed elaborato i dati, e’ il momento di mostrare i risultati sulla pagina:

<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who?rkes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <img class="logo" src="./logo_whorkes.png" alt="logo_whorkes">
        <h3>Trova il lavoro che fa per te</h3>
        <form onsubmit="search(event)">
            <div class="input-icona"><ion-icon name="briefcase-outline"></ion-icon>
            <input class="add-ruolo" type="text" id="work" placeholder="Ruolo (es.Developer)">
            </div>
            <div class="input-icona"><ion-icon name="location-outline"></ion-icon>
            <input class="add-city" type="text" id="posizione" placeholder="Città (es. US)">
            </div>
            <button class="btn-search"><ion-icon name="search-outline"></ion-icon>Cerca</button>
            
        </form>
    </main>
    <div id="risultati"></div>
    <script src="./script.js"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
</body>

</html>
